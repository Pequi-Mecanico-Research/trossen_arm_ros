# ============================================================
# MoveIt Servo — widowX AI (wxai)
# ============================================================

servo_node:
  ros__parameters:
    moveit_servo: 

      # ── Frequência de controle ────────────────────────────────
      publish_period: 0.02          # 100 Hz
  
      # ── Grupo de planejamento ─────────────────────────────────
      move_group_name: arm
  
      # ── Frames ───────────────────────────────────────────────
      planning_frame: base_link
      ee_frame_name: ee_gripper_link
  
      # ── Tópicos de entrada ────────────────────────────────────
      # TwistStamped — publicado pelo servo_bridge.py
      cartesian_command_in_topic: /servo_node/delta_twist_cmds
      # JointJog — não usado, mas precisa estar definido
      joint_command_in_topic: /servo_node/delta_joint_cmds
      pose_command_in_topic: /servo_node/target_pose 
  
      # ── Tópico de saída ───────────────────────────────────────
      command_out_topic: /arm_controller/joint_trajectory
      command_out_type: trajectory_msgs/JointTrajectory
  
      publish_joint_positions: true
      publish_joint_velocities: false
      publish_joint_accelerations: false
  
      # ── Status ────────────────────────────────────────────────
      status_topic: /servo_node/status
  
      # ── Suavização ────────────────────────────────────────────
      smoothing_filter_plugin_name:  online_signal_smoothing::ButterworthFilterPlugin
  
      # ── Escala de velocidade ──────────────────────────────────
      # Fração dos limites do URDF (0.0 a 1.0)
      # Comece conservador e aumente conforme testar
      scale:
        linear:     0.5
        rotational: 0.3
  
      # ── Proteção contra singularidade ────────────────────────
      lower_singularity_threshold: 90.0
      hard_stop_singularity_threshold: 110.0
  
      # ── Proteção contra colisão ───────────────────────────────
      check_collisions:                    true
      collision_check_rate:                10.0
      self_collision_proximity_threshold:  0.01
      scene_collision_proximity_threshold: 0.02
  
      # ── Timeout ───────────────────────────────────────────────
      # O servo_bridge publica zeros quando idle — não dispara HALT
      incoming_command_timeout: 0.5
  
      # ── Joints do widowX AI ───────────────────────────────────
      joints:
        - joint_0
        - joint_1
        - joint_2
        - joint_3
        - joint_4
        - joint_5